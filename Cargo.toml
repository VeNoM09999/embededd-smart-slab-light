[package]
edition      = "2024"
name         = "my-esp-project"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "my-esp-project"
path = "./src/bin/main.rs"

[dependencies]
esp-hal = { version = "1.1.2", features = ["esp32", "log-04", "unstable"] }

esp-rtos = { version = "0.3.0", features = ["embassy", "esp-alloc", "esp-radio", "esp32"] }

esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32"] }

embassy-net = { version = "^0.9.1", features = [
  "dhcpv4",
  "medium-ethernet",
  "tcp",
  "udp",
] }
embedded-io = "0.7.1"
embedded-io-async = "^0.7.0"
esp-alloc = "0.10.0"
# for more networking protocol support see https://crates.io/crates/edge-net
embassy-executor = { version = "0.10.0", features = [] }
embassy-time = "0.5.0"
esp-radio = { version = "0.18.0", features = [
  "esp-alloc",
  "esp32",
  "unstable",
  "wifi",
] }
smoltcp = { version = "0.13.1", default-features = false, features = [
  "medium-ethernet",
  "multicast",
  "proto-dhcpv4",
  "proto-dns",
  "proto-ipv4",
  "socket-dns",
  "socket-icmp",
  "socket-raw",
  "socket-tcp",
  "socket-udp",
] }

critical-section = "1.2.0"
static_cell      = "2.1.1"
edge-dhcp = "0.8"
edge-nal = "^0.7.0"
edge-nal-embassy = "=0.9.0"
esp-println = { version = "0.17.0", features = ["esp32", "log-04"] }
picoserve = { version = "0.19.0", features = ["embassy", "json", "log", "ws"] }
heapless = "0.8.0"
embassy-sync = "0.8.0"
embedded-hal = "1.0.0"
serde = { version = "1.0.229", default-features = false, features = ["serde_derive"] }
esp-storage = { version = "0.9.0", features = ["esp32"] }
embedded-storage = "0.3.1"
serde-json-core = "0.6.0"


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
